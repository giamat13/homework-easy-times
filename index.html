<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="ניהול משימות, מטלות ומבחנים לתלמידים — בעברית, מהטלפון.">
<title>המשימות שלי</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✅</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700;800&family=Rubik:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<script>
// החלת ערכת הנושא לפני הצביעה הראשונה — מונע הבזק לבן במצב לילה.
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('theme-settings') || 'null') || {};
    var dark = t.followSystem === false ? !!t.dark : matchMedia('(prefers-color-scheme: dark)').matches;
    var r = document.documentElement;
    r.dataset.theme = t.name || 'indigo';
    r.dataset.mode = dark ? 'dark' : 'light';
    r.dataset.density = t.density || 'comfy';
    r.style.colorScheme = dark ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.mode = 'light'; }
})();
</script>
</head>
<body>
<a class="skip-link" href="#view">דילוג לתוכן הראשי</a>
<header class="app-nav" id="app-nav"></header>

<main class="shell">
  <div class="page-head">
    <div class="page-head__title">
      <h1>המשימות שלי</h1>
      <span class="page-head__sub" id="today-label"></span>
    </div>
  </div>

  <section id="strip" aria-label="סיכום מצב"></section>

  <div class="filters" id="filters" aria-label="סינון ומיון"></div>

  <div id="view" tabindex="-1" aria-live="polite" aria-busy="true">
    <div class="boot"><div class="spinner" role="status" aria-label="טוען"></div><p>טוען את הנתונים…</p></div>
  </div>

  <aside class="card" style="margin-block-start:var(--space-5)">
    <div class="card__head">
      <h2 class="card__title">📅 מהיומן שלי</h2>
    </div>
    <div id="gcal"></div>
  </aside>
</main>

<button class="fab" id="fab" type="button" aria-label="הוספת משימה חדשה" title="משימה חדשה (N)">+</button>

<script type="module">
  document.getElementById('today-label').textContent =
    new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  document.getElementById('view').setAttribute('aria-busy', 'false');
</script>
<script type="module" src="js/app.js"></script>
<noscript>
  <p style="padding:24px;text-align:center">האפליקציה דורשת JavaScript מופעל.</p>
</noscript>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>כניסה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔐</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<script>
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('theme-settings') || 'null') || {};
    var dark = t.followSystem === false ? !!t.dark : matchMedia('(prefers-color-scheme: dark)').matches;
    var r = document.documentElement;
    r.dataset.theme = t.name || 'indigo';
    r.dataset.mode = dark ? 'dark' : 'light';
    r.dataset.density = t.density || 'comfy';
    r.style.colorScheme = dark ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.mode = 'light'; }
})();
</script>
</head>
<body>
<main class="auth-wrap" id="view">
  <div class="boot"><div class="spinner" role="status" aria-label="טוען"></div></div>
</main>
<script type="module" src="js/loginpage.js"></script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>סטטיסטיקה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700;800&family=Rubik:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<script>
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('theme-settings') || 'null') || {};
    var dark = t.followSystem === false ? !!t.dark : matchMedia('(prefers-color-scheme: dark)').matches;
    var r = document.documentElement;
    r.dataset.theme = t.name || 'indigo';
    r.dataset.mode = dark ? 'dark' : 'light';
    r.dataset.density = t.density || 'comfy';
    r.style.colorScheme = dark ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.mode = 'light'; }
})();
</script>
</head>
<body>
<a class="skip-link" href="#view">דילוג לתוכן הראשי</a>
<header class="app-nav" id="app-nav"></header>

<main class="shell">
  <div class="page-head">
    <div class="page-head__title">
      <h1>סטטיסטיקה ותובנות</h1>
      <span class="page-head__sub" id="range-label"></span>
    </div>
    <div class="row no-print">
      <select id="range" aria-label="טווח זמן">
        <option value="30">30 ימים אחרונים</option>
        <option value="90">3 חודשים</option>
        <option value="180">חצי שנה</option>
        <option value="0">הכל</option>
      </select>
      <button class="btn btn--sm" type="button" id="print-report">🖨️ הדפסה / PDF</button>
    </div>
  </div>

  <div id="view" tabindex="-1" aria-live="polite">
    <div class="boot"><div class="spinner" role="status" aria-label="טוען"></div></div>
  </div>
</main>

<script type="module" src="js/statspage.js"></script>
</body>
</html>
